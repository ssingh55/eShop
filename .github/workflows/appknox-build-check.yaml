# Appknox build check (MAUI, Android target). Build only: nothing is installed, launched or tested.
name: Appknox Build Check

on:
  push:
    branches: [ci/build-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install the Android MAUI workload
        run: dotnet workload install android maui-android
      - name: Build (build only, no tests, no run)
        run: dotnet build src/ClientApp/ClientApp.csproj -f net10.0-android -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: src/ClientApp/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
